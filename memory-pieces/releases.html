<script>
(function () {
  var root = document.documentElement, buttons = document.querySelectorAll('.theme-switch button');
  function apply(mode) {
    if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
  }
  var saved = 'system';
  try { saved = localStorage.getItem('memory-pieces-theme') || 'system'; } catch (e) {}
  apply(saved);
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      apply(b.dataset.mode);
      try { localStorage.setItem('memory-pieces-theme', b.dataset.mode); } catch (e) {}
    });
  });
})();
</script><script>
(() => {
  const menu = document.querySelector('.langs');
  if (!menu) return;
  document.addEventListener('click', e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && menu.open) { menu.open = false; menu.querySelector('summary').focus(); }
  });
})();
</script>
